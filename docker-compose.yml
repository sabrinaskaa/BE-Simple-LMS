# =============================================================================
# Simple LMS - Docker Compose
# =============================================================================
# Semua nilai sensitif dibaca dari file .env di direktori yang sama.
# Salin .env.example → .env lalu isi nilainya sebelum menjalankan:
#   docker compose up -d
# =============================================================================

services:
  app:
    image: kaqfa/be_simple_lms-django
    container_name: lms-app
    command: sh -c "pip install -r requirements.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./code:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database
      - redis
      - mongodb
      - rabbitmq

  database:
    image: postgres:16
    container_name: lms-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mongodb:
    image: mongo:7
    container_name: lms-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: lms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  celery-worker:
    image: kaqfa/be_simple_lms-django
    container_name: lms-celery-worker
    command: sh -c "pip install -r requirements.txt && celery -A lms worker -l info"
    volumes:
      - ./code:/code
    env_file:
      - .env
    depends_on:
      - app
      - redis
      - mongodb
      - rabbitmq

  celery-beat:
    image: kaqfa/be_simple_lms-django
    container_name: lms-celery-beat
    command: sh -c "pip install -r requirements.txt && celery -A lms beat -l info"
    volumes:
      - ./code:/code
    env_file:
      - .env
    depends_on:
      - app
      - redis
      - mongodb
      - rabbitmq

  flower:
    image: kaqfa/be_simple_lms-django
    container_name: lms-flower
    command: sh -c "pip install -r requirements.txt && celery -A lms flower --port=5555"
    volumes:
      - ./code:/code
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - celery-worker
      - rabbitmq

volumes:
  pg_data:
  redis_data:
  mongo_data:
